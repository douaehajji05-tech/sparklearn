<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | SparkLearn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>html{visibility:hidden}</style>

</head>

<body>

<header class="navbar">

    <div class="container dashboard-topbar">

        <a href="index.html" class="logo-group">
            <span class="logo-icon"><i class="fa-solid fa-book-open"></i></span>
            <span class="logo-text">
                SparkLearn
                <small>Professor Dashboard</small>
            </span>
        </a>

        <div class="dashboard-user">
            <span id="user-email" class="user-email"></span>
            <button id="logout-btn" class="btn-small secondary">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>

    </div>

</header>

<main class="dashboard">

<div class="container">

<h1>Professor Dashboard</h1>

<p>
Manage all website content from one place.
</p>

<div class="dashboard-grid">

<div class="dashboard-card">

<h2>Upload New File</h2>

<form id="upload-form" class="form-stack">

    <div>
        <label for="file-category">Category</label>
        <select id="file-category" required>
            <option value="exams">Exams</option>
            <option value="vocabulary">Vocabulary</option>
            <option value="resources">Resources</option>
            <option value="weekly">Weekly</option>
            <option value="reports">Reports</option>
            <option value="scholarships">Scholarships</option>
        </select>
    </div>

    <div>
        <label for="file-year">Academic Year</label>
        <select id="file-year">
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
            <option value="5">5th Year</option>
        </select>
    </div>

    <div>
        <label for="file-semester">Semester</label>
        <select id="file-semester">
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
        </select>
    </div>

    <div>
        <label for="file-title">File Title</label>
        <input type="text" id="file-title" required placeholder="Example: English Final Exam">
    </div>

    <div>
        <label for="file-input">Select PDF</label>
        <input type="file" id="file-input" accept=".pdf" required>
    </div>

    <button type="submit" class="btn">
        <span class="btn-label">Publish</span>
    </button>

    <p id="upload-status" class="status-msg" hidden></p>

</form>

</div>

<div class="dashboard-card">

<h2>Announcements</h2>

<p>
Publish announcements for students.
</p>

<form id="announcement-form" class="form-stack">

    <div>
        <label for="announcement-title">Title</label>
        <input type="text" id="announcement-title" required placeholder="Example: New Exam Added">
    </div>

    <div>
        <label for="announcement-content">Message</label>
        <textarea id="announcement-content-input" rows="3" required placeholder="Short description..."></textarea>
    </div>

    <button type="submit" class="btn">
        <span class="btn-label">Publish</span>
    </button>

    <p id="announcement-status" class="status-msg" hidden></p>

</form>

<ul id="announcement-list" class="dash-list"></ul>

</div>

<div class="dashboard-card">

<h2>Manage Files</h2>

<p>
Edit or delete uploaded files.
</p>

<ul id="file-list" class="dash-list"></ul>

</div>

</div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
